<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShipSafe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">

    <h1>{{ project[1] }}</h1>

    <p>This is your project.</p>

    <div class="card">

        <h3>Flags</h3>

        {% for flag in flags %}
        <div class="flag">
            <div>
                <strong>{{ flag[1] }}</strong>
            </div>
            <div>
            <form class="delete-flag" action="/projects/{{ project[0] }}/flags/{{ flag[0] }}/delete" method="post">
                <button type="submit">Delete</button>
            </form>

                <form class="toggle-flag" action="/projects/{{ project[0] }}/flags/{{ flag[0] }}/toggle" method="post">
                    <button type="submit">
                        {% if flag[2] %}
                        Disable
                        {% else %}
                        Enable
                        {% endif %}
                    </button>
                </form>

            </div>
        </div>
    {% endfor %}

    <div class="card">

    <h3>Create Flag</h3>
    <form action="/projects/{{ project[0] }}/flags" method="post">
        <input type="text" name="flag_name" placeholder="Flag name" aria-label="Flag name">
        <button type="submit">Create Flag</button>
    </form>
    </div>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <a href="/">Back to dashboard</a>

    <div class="card">
        <h2>API Key</h2>
        <p id="api-key">{{ api_key }}</p>
        <button type="button" id="copy-api-key">Copy API Key</button>
    </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
